name: Build

on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    - cron: "0 10 * * *"

jobs:
  build:
    runs-on: ubuntu-24.04
    container: ghcr.io/cognipilot/cognipilot-workspace:latest
    env:
      CMAKE_PREFIX_PATH: /opt/toolchains
      CCACHE_DIR: /ccache
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          path: cerebri

      - name: Install build dependencies
        run: |
          set -euo pipefail
          apt-get update -qq
          apt-get install -y -qq ca-certificates ccache git
          update-ca-certificates
          echo "/usr/bin" >> "$GITHUB_PATH"
          test -x /usr/bin/ccache
          test -f /etc/ssl/certs/ca-certificates.crt

      - name: Cache west modules
        uses: actions/cache@v4
        with:
          path: |
            bootloader
            modules
            tools
            zephyr
          key: west-${{ hashFiles('cerebri/west.yml') }}
          restore-keys: |
            west-

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: /ccache
          key: ccache-${{ github.ref_name }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ github.ref_name }}-
            ccache-main-
            ccache-

      - name: Initialize
        working-directory: cerebri
        run: |
          set -euo pipefail
          export PATH="/root/.local/bin:/github/home/.local/bin:$PATH"
          export SSL_CERT_FILE=/etc/ssl/certs/ca-certificates.crt
          export GIT_SSL_CAINFO=/etc/ssl/certs/ca-certificates.crt

          python3 -m pip install --user --break-system-packages poetry
          command -v poetry
          poetry --version

          west init -l .
          west update
          ./scripts/cyecca_install

      - name: Format Check
        working-directory: cerebri
        run: |
          export PATH="/root/.local/bin:/github/home/.local/bin:$PATH"
          west format -c

      - name: Twister Tests
        working-directory: cerebri
        run: |
          export PATH="/root/.local/bin:/github/home/.local/bin:$PATH"
          west test

      - name: Show ccache stats
        if: always()
        run: |
          if [ -x /usr/bin/ccache ]; then
            /usr/bin/ccache -s
          else
            echo "::warning::ccache is not installed in the build container"
          fi

  misra:
    runs-on: ubuntu-24.04
    env:
      MISRA_IMAGE: ghcr.io/cognipilot/cognipilot-workspace:latest
      CMAKE_PREFIX_PATH: /opt/toolchains
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          path: cerebri

      - name: Cache west modules
        uses: actions/cache@v4
        with:
          path: |
            bootloader
            modules
            tools
            zephyr
          key: west-${{ hashFiles('cerebri/west.yml') }}
          restore-keys: |
            west-

      - name: Initialize and build compile_commands.json
        run: |
          docker run --rm \
            --user 0:0 \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -w /workspace/cerebri \
            -e HOME=/root \
            -e CMAKE_PREFIX_PATH=/opt/toolchains \
            -e SSL_CERT_FILE=/etc/ssl/certs/ca-certificates.crt \
            -e GIT_SSL_CAINFO=/etc/ssl/certs/ca-certificates.crt \
            "$MISRA_IMAGE" bash -euo pipefail -c '
              set -euo pipefail
              apt-get update -qq
              apt-get install -y -qq ca-certificates git
              update-ca-certificates

              export PATH="/root/.local/bin:/github/home/.local/bin:$PATH"
              export SSL_CERT_FILE=/etc/ssl/certs/ca-certificates.crt
              export GIT_SSL_CAINFO=/etc/ssl/certs/ca-certificates.crt

              python3 -m pip install --user --break-system-packages poetry
              command -v poetry
              poetry --version

              west init -l .
              west update
              ./scripts/cyecca_install
              west build -p always -b mr_canhubk3/s32k344 app/b3rb \
                -- -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
            '

      - name: Run cppcheck MISRA analysis
        run: |
          docker run --rm \
            --user 0:0 \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -w /workspace/cerebri \
            -e HOME=/root \
            "$MISRA_IMAGE" bash -euo pipefail -c '
              apt-get update -qq
              apt-get install -y -qq cppcheck
              cppcheck \
                --project=build/compile_commands.json \
                --addon=misra \
                --inline-suppr \
                --suppressions-list=tools/misra/suppressions.txt \
                -i zephyr -i modules -i build \
                --error-exitcode=0 \
                --xml --xml-version=2 \
                2> misra-report.xml
              echo "### MISRA — mr_canhubk3/s32k344, app/b3rb" >> "$GITHUB_STEP_SUMMARY"
              grep -o 'id="[^"]*"' misra-report.xml | sort | uniq -c | sort -rn >> "$GITHUB_STEP_SUMMARY" || true
            '

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: misra-report
          path: cerebri/misra-report.xml

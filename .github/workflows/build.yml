name: Build

on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    - cron: "0 10 * * *"

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      CMAKE_PREFIX_PATH: /opt/toolchains
      CCACHE_DIR: /ccache

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: cerebri

      - name: Install build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            ca-certificates \
            ccache \
            git \
            libc6-dev \
            python3 \
            python3-pip
          sudo update-ca-certificates
          command -v ccache
          test -x /usr/bin/ccache
          test -f /etc/ssl/certs/ca-certificates.crt
          sudo mkdir -p /ccache
          sudo chown "$(id -u):$(id -g)" /ccache

      - name: Cache west modules
        uses: actions/cache@v4
        with:
          path: |
            bootloader
            modules
            tools
            zephyr
          key: west-${{ hashFiles('cerebri/west.yml') }}
          restore-keys: |
            west-

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: /ccache
          key: ccache-${{ github.ref_name }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ github.ref_name }}-
            ccache-main-
            ccache-

      - name: Initialize
        working-directory: cerebri
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.local/bin:$PATH"
          export SSL_CERT_FILE=/etc/ssl/certs/ca-certificates.crt
          export GIT_SSL_CAINFO=/etc/ssl/certs/ca-certificates.crt

          python3 -m pip install --user --break-system-packages poetry west
          command -v poetry
          poetry --version
          command -v west
          west --version

          west init -l .
          west update
          ./scripts/cyecca_install
          python3 -m pip install --user --break-system-packages \
            -r ../zephyr/scripts/requirements.txt
          west sdk install -d /opt/toolchains

      - name: Format Check
        working-directory: cerebri
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.local/bin:$PATH"
          west format -c

      - name: Twister Tests
        working-directory: cerebri
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.local/bin:$PATH"
          west test

      - name: Show ccache stats
        if: always()
        shell: bash
        run: |
          if command -v ccache >/dev/null 2>&1; then
            ccache -s
          else
            echo "::warning::ccache is not installed"
          fi

  misra:
    runs-on: ubuntu-24.04
    env:
      MISRA_IMAGE: ghcr.io/cognipilot/cognipilot-workspace:latest
      CMAKE_PREFIX_PATH: /opt/toolchains

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: cerebri

      - name: Cache west modules
        uses: actions/cache@v4
        with:
          path: |
            bootloader
            modules
            tools
            zephyr
          key: west-${{ hashFiles('cerebri/west.yml') }}
          restore-keys: |
            west-

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3 python3-pip

      - name: Initialize
        working-directory: cerebri
        run: |
          export PATH="/github/home/.local/bin:$PATH"
          west init -l .
          west update
          ./scripts/cyecca_install
          west sdk install -d /opt/toolchains

      # One representative board/app, not the full twister matrix — MISRA
      # here is a structural/style check, not per-board coverage. See
      # tools/misra/README.md for why.
      - name: Build compile_commands.json (mr_canhubk3/s32k344, app/b3rb)
        working-directory: cerebri
        run: |
          export PATH="/github/home/.local/bin:$PATH"
          west build -p always -b mr_canhubk3/s32k344 app/b3rb \
            -- -DCMAKE_EXPORT_COMPILE_COMMANDS=ON

      - name: Install cppcheck
        run: |
          set -euo pipefail
          docker run --rm \
            --user 0:0 \
            --entrypoint /bin/bash \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -w /workspace/cerebri \
            -e HOME=/root \
            -e CMAKE_PREFIX_PATH=/opt/toolchains \
            -e SSL_CERT_FILE=/etc/ssl/certs/ca-certificates.crt \
            -e GIT_SSL_CAINFO=/etc/ssl/certs/ca-certificates.crt \
            "$MISRA_IMAGE" \
            -lc 'set -euo pipefail
              export PATH=/root/.local/bin:$PATH
              python3 -m pip install --user --break-system-packages poetry west
              poetry --version
              west --version
              west init -l .
              west update
              ./scripts/cyecca_install
              west build -b native_sim -d build -t dans -- -DCMAKE_EXPORT_COMPILE_COMMANDS=ON'

      - name: Run cppcheck MISRA analysis
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            --user 0:0 \
            --entrypoint /bin/bash \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -w /workspace/cerebri \
            -e HOME=/root \
            "$MISRA_IMAGE" \
            -lc "set -euo pipefail; nix shell nixpkgs#cppcheck --command cppcheck --project=build/compile_commands.json --addon=misra --inline-suppr --suppressions-list=tools/misra/suppressions.txt --xml --xml-version=2 2>misra-report.xml"

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: misra-report
          path: cerebri/misra-report.xml

name: Build

on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    - cron: "0 10 * * *"

jobs:
  build:
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/cognipilot/cognipilot-workspace:latest
      options: --user 0:0 --entrypoint ""
    env:
      CMAKE_PREFIX_PATH: /opt/toolchains
      CCACHE_DIR: /ccache
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          path: cerebri

      - name: Install build dependencies
        run: |
          set -euxo pipefail

          apt-get update -qq
          apt-get install -y -qq \
            ca-certificates \
            ccache \
            git \
            python3-pip

          update-ca-certificates
          git config --global http.sslCAInfo /etc/ssl/certs/ca-certificates.crt
          git config --global http.sslVerify true

          python3 -m pip install --break-system-packages poetry
          export PATH="/root/.local/bin:/usr/local/bin:$PATH"

          command -v poetry
          poetry --version

          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "/usr/bin" >> "$GITHUB_PATH"

          mkdir -p /workspace
          chmod 0777 /workspace
          test -x /usr/bin/ccache

      - name: Cache west modules
        uses: actions/cache@v4
        with:
          path: |
            bootloader
            modules
            tools
            zephyr
          key: west-v2-${{ hashFiles('cerebri/west.yml') }}
          restore-keys: |
            west-v2-
            west-

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: /ccache
          key: ccache-${{ github.ref_name }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ github.ref_name }}-
            ccache-main-
            ccache-

      - name: Initialize
        working-directory: cerebri
        run: |
          set -euxo pipefail
          export PATH="/root/.local/bin:/usr/local/bin:$PATH"

          git ls-remote https://github.com/CogniPilot/zephyr \
            fd02d713535e8e683ec0e34fb942a08fe955878d

          west init -l .
          west update
          ./scripts/cyecca_install

      - name: Format Check
        working-directory: cerebri
        run: |
          export PATH="/root/.local/bin:/usr/local/bin:$PATH"
          west format -c

      - name: Twister Tests
        working-directory: cerebri
        run: |
          export PATH="/root/.local/bin:/usr/local/bin:$PATH"
          west test

      - name: Show ccache stats
        if: always()
        run: |
          if [ -x /usr/bin/ccache ]; then
            /usr/bin/ccache -s
          else
            echo "::warning::ccache is not installed in the build container"
          fi

  misra:
    runs-on: ubuntu-24.04
    env:
      MISRA_IMAGE: ghcr.io/cognipilot/cognipilot-workspace:latest
      CMAKE_PREFIX_PATH: /opt/toolchains
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          path: cerebri

      - name: Cache west modules
        uses: actions/cache@v4
        with:
          path: |
            bootloader
            modules
            tools
            zephyr
          key: west-v2-${{ hashFiles('cerebri/west.yml') }}
          restore-keys: |
            west-v2-
            west-

      - name: Initialize and build compile_commands.json
        run: |
          docker run --rm \
            --user 0:0 \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -w /workspace/cerebri \
            -e CMAKE_PREFIX_PATH=/opt/toolchains \
            "$MISRA_IMAGE" bash -euxo pipefail -lc '
              export PATH="/root/.local/bin:/usr/local/bin:$PATH"

              apt-get update -qq
              apt-get install -y -qq \
                ca-certificates \
                git \
                python3-pip

              update-ca-certificates
              git config --global http.sslCAInfo /etc/ssl/certs/ca-certificates.crt
              git config --global http.sslVerify true

              python3 -m pip install --break-system-packages poetry

              command -v poetry
              poetry --version

              git ls-remote https://github.com/CogniPilot/zephyr \
                fd02d713535e8e683ec0e34fb942a08fe955878d

              mkdir -p /workspace
              chmod 0777 /workspace

              west init -l .
              west update
              ./scripts/cyecca_install

              west build -p always -b mr_canhubk3/s32k344 app/b3rb \
                -- -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
            '

      - name: Run cppcheck MISRA analysis
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -w /workspace/cerebri \
            "$MISRA_IMAGE" bash -lc '
              apt-get update -qq
              apt-get install -y -qq cppcheck
              cppcheck \
                --project=build/compile_commands.json \
                --addon=misra \
                --inline-suppr \
                --suppressions-list=tools/misra/suppressions.txt \
                -i zephyr -i modules -i build \
                --error-exitcode=0 \
                --xml --xml-version=2 \
                2> misra-report.xml
              echo "### MISRA — mr_canhubk3/s32k344, app/b3rb" >> "$GITHUB_STEP_SUMMARY"
              grep -o '"'"'id="'"'[^"'"']*"'"'" misra-report.xml | sort | uniq -c | sort -rn >> "$GITHUB_STEP_SUMMARY" || true
            '

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: misra-report
          path: cerebri/misra-report.xml

name: Build

on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    - cron: "0 10 * * *"

jobs:
  build:
    runs-on: ubuntu-24.04
    container: ghcr.io/cognipilot/cognipilot-workspace:latest
    env:
      CMAKE_PREFIX_PATH: /opt/toolchains
      CCACHE_DIR: /ccache
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          path: cerebri

      - name: Install build dependencies
        run: |
          apt-get update -qq
          apt-get install -y -qq ccache
          echo "/usr/bin" >> "$GITHUB_PATH"
          test -x /usr/bin/ccache

      - name: Cache west modules
        uses: actions/cache@v4
        with:
          path: |
            bootloader
            modules
            tools
            zephyr
          key: west-${{ hashFiles('cerebri/west.yml') }}
          restore-keys: |
            west-

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: /ccache
          key: ccache-${{ github.ref_name }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ github.ref_name }}-
            ccache-main-
            ccache-

      - name: Initialize
        working-directory: cerebri
        run: |
          export PATH="/github/home/.local/bin:$PATH"
          west init -l .
          west update
          ./scripts/cyecca_install

      - name: Format Check
        working-directory: cerebri
        run: |
          export PATH="/github/home/.local/bin:$PATH"
          west format -c

      - name: Twister Tests
        working-directory: cerebri
        run: |
          export PATH="/github/home/.local/bin:$PATH"
          west test

      - name: Show ccache stats
        if: always()
        run: |
          if [ -x /usr/bin/ccache ]; then
            /usr/bin/ccache -s
          else
            echo "::warning::ccache is not installed in the build container"
          fi

  misra:
    runs-on: ubuntu-24.04
    # Do not use a job-level container here. GitHub mounts JavaScript action
    # runtimes into container jobs, but the workspace image cannot execute
    # those runtimes (upload-artifact fails with ENOENT for /__e/node20/bin/node).
    # Run the analysis in the workspace image explicitly and keep the runner
    # available for checkout, cache, and artifact actions.
    env:
      MISRA_IMAGE: ghcr.io/cognipilot/cognipilot-workspace:latest
      CMAKE_PREFIX_PATH: /opt/toolchains
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          path: cerebri

      - name: Cache west modules
        uses: actions/cache@v4
        with:
          path: |
            bootloader
            modules
            tools
            zephyr
          key: west-${{ hashFiles('cerebri/west.yml') }}
          restore-keys: |
            west-

      - name: Initialize and build compile_commands.json
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -w /workspace/cerebri \
            -e CMAKE_PREFIX_PATH=/opt/toolchains \
            "$MISRA_IMAGE" bash -lc '
              export PATH="/github/home/.local/bin:$PATH"
              west init -l .
              west update
              ./scripts/cyecca_install
              west build -p always -b mr_canhubk3/s32k344 app/b3rb \
                -- -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
            '

      - name: Run cppcheck MISRA analysis
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -w /workspace/cerebri \
            "$MISRA_IMAGE" bash -lc '
              apt-get update -qq
              apt-get install -y -qq cppcheck
              cppcheck \
                --project=build/compile_commands.json \
                --addon=misra \
                --inline-suppr \
                --suppressions-list=tools/misra/suppressions.txt \
                -i zephyr -i modules -i build \
                --error-exitcode=0 \
                --xml --xml-version=2 \
                2> misra-report.xml
              echo "### MISRA — mr_canhubk3/s32k344, app/b3rb" >> "$GITHUB_STEP_SUMMARY"
              grep -o '"'"'id="'"'[^"'"']*"'"'" misra-report.xml | sort | uniq -c | sort -rn >> "$GITHUB_STEP_SUMMARY" || true
            '

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: misra-report
          path: cerebri/misra-report.xml
